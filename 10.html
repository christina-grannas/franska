.chap::after{right:-8px;top:12px;transform:rotate(30deg);box-shadow:-4px 44px 0 var(--yellow)}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(30px,8.4vw,48px);line-height:.98;margin:0;letter-spacing:.01em}

.tools{grid-column:1 / -1;display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

nav.tabs .inner::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:none;background:none;padding:8px 12px 10px;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--maroon)}

.mi b{font-size:18px}

.check li.done label{text-decoration:line-through;color:var(--muted)}

.link{border:none;background:none;padding:6px 0;font-weight:700;color:var(--maroon)}

.sub{margin:0 0 4px;color:var(--muted);font-size:15px}

.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

.wl .hide > span{display:none}

.vt{background:var(--yellow-soft);border:3px solid var(--gold);border-radius:12px;padding:12px 14px}

.vt .row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:6px}

@media (max-width:420px){.chap{font-size:52px;padding:4px 10px}.vt .row{grid-template-columns:82px 1fr}.vt .key{margin-left:90px}}

/* ---------- Grading ---------- */
function norm(s){return s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/œ/g,'oe').replace(/[!?.,;:«»"“”…()]/g,' ').replace(/-/g,' ').replace(/\s*'\s*/g,"'").replace(/\s+/g,' ').trim().replace(/(^|\s)([ldjnsc]|qu) (?=[aeiouyhéèêàâîôû])/g,"$1$2'")}
const deacc=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const dropArt=s=>s.replace(/^(le |la |les |un |une |l')/,'');
const dropSv=s=>s.replace(/^(en |ett |att )/,'');
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function grade(input,it){
  const n=norm(input);if(!n)return'empty';
  const sv=it.lang==='sv';
  const vars=x=>sv?[x,dropSv(x)]:(it.requireArt?[x]:[x,dropArt(x)]);
  const A=it.answers.map(norm), N=vars(n);
  for(const a of A)if(vars(a).some(v=>N.includes(v)))return'ok';
  for(const a of A){const av=vars(a).map(deacc);if(N.map(deacc).some(v=>av.includes(v)))return'accent'}
  if(it.requireArt)for(const a of A)if(deacc(dropArt(n))===deacc(dropArt(a)))return /^(un|une) /.test(n)?'article':'noart';
  for(const a of A)for(const x of N)for(const y of vars(a)){const d=lev(deacc(x),deacc(y));if((y.length>4&&d<=1)||(y.length>12&&d<=2))return'near'}
  return'bad';
}

/* ---------- Quiz runner ---------- */
function accentBar(inp){const chars=['é','è','ê','à','â','ç','ù','û','î','ï','ô','œ','’'];
  return h('div',{class:'accents','aria-label':'Franska tecken'},chars.map(c=>h('button',{type:'button',onmousedown:e=>e.preventDefault(),onclick:()=>{const s=inp.selectionStart??inp.value.length,e2=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+c+inp.value.slice(e2);inp.focus();try{inp.setSelectionRange(s+1,s+1)}catch(e){}}},c)))}

function runQuiz(factory,opts={}){
  const back=opts.back||(()=>render(state.tab));
  let items=factory(),i=0,score=0,wrong=[];
  const main=$('#main');
  function show(){
    main.replaceChildren();window.scrollTo(0,0);
    if(i>=items.length)return done();
    const it=items[i];let answered=false;
    main.append(h('div',{class:'qtop'},h('button',{class:'link',onclick:()=>{speechSynthesis?.cancel?.();back()}},'‹ Tillbaka'),h('span',{class:'count'},`${i+1} av ${items.length} · rätt ${score}`)));
    main.append(h('div',{class:'bar'},h('span',{style:`width:${i/items.length*100}%`})));
    const card=h('section',{class:'qcard'});main.append(card);
    card.append(h('p',{class:'sub'},it.sub));
    if(it.audio){card.append(h('button',{class:'bigplay',type:'button',onclick:()=>say(it.audio)},'🔊 Spela upp igen'));setTimeout(()=>say(it.audio),200)}
    if(it.prompt)card.append(h('div',{class:'prompt'+(it.long?' long':''),lang:it.say?'fr':null},it.prompt,it.say?' ':null,it.say?speakBtn(it.say):null));
    if(it.hintSv)card.append(h('details',{class:'hint'},h('summary',null,'Visa på svenska'),it.hintSv));
    if(it.say&&!it.audio)setTimeout(()=>autoSay(it.say),200);
    const fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
    const actions=h('div',{class:'actions'});
    const nextBtn=h('button',{class:'btn primary',type:'button',onclick:()=>{i++;show()}},i+1<items.length?'Nästa':'Se resultatet');
    function finish(r){
      answered=true;const ok=r==='ok'||r==='accent';
      if(ok){score++;unmiss(it)}else{wrong.push(it);miss(it)}
      const sv=it.lang==='sv';
      const msg={ok:'Rätt!',accent:sv?'Rätt – men kolla å, ä och ö:':'Rätt – men kolla accenterna:',near:'Nästan! Kolla stavningen. Rätt svar:',article:'Fel artikel – un eller une? Rätt svar:',noart:'Glöm inte un eller une! Rätt svar:',bad:'Inte riktigt. Rätt svar:',skip:'Rätt svar:'}[r];
      fb.className='fb show '+(r==='ok'?'ok':r==='accent'?'warn':'bad');
      fb.replaceChildren(h('div',{class:'txt'},h('strong',null,(ok?'✓ ':'✗ ')+msg),h('span',{class:'ans-show'},it.show)),it.sayAns?speakBtn(it.sayAns):null);
      if(it.sayAns)autoSay(it.sayAns);
      actions.replaceChildren(nextBtn);nextBtn.focus({preventScroll:true});
    }
    if(it.type==='write'){
      const inp=h('input',{class:'ans',type:'text',autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false',lang:it.lang==='sv'?'sv':'fr','aria-label':'Ditt svar',placeholder:it.lang==='sv'?'Skriv på svenska':'Skriv på franska'});
      const check=()=>{if(answered)return;const r=grade(inp.value,it);if(r==='empty'){inp.focus();return}inp.disabled=true;finish(r)};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
      card.append(inp);if(it.lang!=='sv')card.append(accentBar(inp));
      actions.append(h('button',{class:'btn',type:'button',onclick:()=>{if(!answered){inp.disabled=true;finish('skip')}}},'Vet inte'),h('button',{class:'btn primary',type:'button',onclick:check},'Rätta'));
      card.append(fb,actions);setTimeout(()=>inp.focus({preventScroll:true}),50);
    }else{
      const wrap=h('div',{class:'opts'});
      const btns=it.options.map(o=>h('button',{class:'opt',type:'button',onclick:()=>{if(answered)return;const ok=o===it.correct;btns.forEach(b=>{b.disabled=true;if(b.dataset.v===it.correct)b.classList.add('right')});if(!ok)btn(o).classList.add('wrong');finish(ok?'ok':'bad')}},o));
      btns.forEach((b,k)=>b.dataset.v=it.options[k]);const btn=o=>btns.find(b=>b.dataset.v===o);
      wrap.append(...btns);card.append(wrap,fb,actions);
    }
  }
  function done(){
    const pct=score/items.length;
    if(opts.record)lsSet('lastTest',{score,total:items.length,date:Date.now()});
    const msg=pct>=.9?'Superbra! 🎉':pct>=.7?'Bra jobbat! 💪':pct>=.5?'På god väg!':'Kör en gång till – det sitter snart.';
    const res=h('section',{class:'qcard result'},h('div',{class:'score'},`${score}/${items.length}`),h('p',null,msg));
    if(wrong.length){res.append(h('p',{class:'note'},'De här ska du öva mer på:'),h('ul',{class:'miss-list'},wrong.map(w=>h('li',null,h('span',null,h('span',{class:'q'},w.prompt||'(hörövning)'),h('span',{class:'a'},w.show)),w.sayAns?speakBtn(w.sayAns):null))))}
    const acts=h('div',{class:'actions',style:'justify-content:center'});
    if(wrong.length){const w=wrong.slice();acts.append(h('button',{class:'btn primary',onclick:()=>runQuiz(()=>shuffle(w),{back})},`Öva på de ${w.length} missade`))}
    acts.append(h('button',{class:'btn',onclick:()=>runQuiz(factory,opts)},'Kör igen'),h('button',{class:'btn',onclick:back},'Tillbaka'));
    res.append(acts);main.append(res);window.scrollTo(0,0);
  }
  show();
}

    const c=deck[0],frFirst=!rev;
    const front=frFirst?c.fr:c.sv,backT=frFirst?c.sv:c.fr;
    main.append(h('button',{class:'flash',type:'button',onclick:()=>{if(!flipped){flipped=true;show();if(!frFirst)autoSay(c.say||clean(c.fr))}}},
      h('span',{class:'lab'},frFirst?'Franska':'Svenska'),h('span',{class:'front',lang:frFirst?'fr':'sv'},front),
      flipped?h('span',{class:'back',lang:frFirst?'sv':'fr'},backT):h('span',{class:'tap'},'Tänk på svaret – tryck sedan för att vända')));
    const bar=h('div',{class:'cardbar'},speakBtn(c.say||clean(c.fr)),h('button',{class:'chip',type:'button',onclick:()=>{rev=!rev;flipped=false;show()}},rev?'Visa franska först':'Visa svenska först'));
    const grow=h('div',{class:'grow'});
    if(flipped){grow.append(h('button',{class:'btn',onclick:()=>{const x=deck.shift();deck.splice(Math.min(3,deck.length),0,x);flipped=false;show()}},'Igen'),h('button',{class:'btn primary',onclick:()=>{deck.shift();flipped=false;show()}},'Kan den ✓'))}
    else grow.append(h('button',{class:'btn primary',onclick:()=>{flipped=true;show();if(!frFirst)autoSay(c.say||clean(c.fr))}},'Vänd'));
    bar.append(grow);main.append(bar);
    if(frFirst&&!flipped)setTimeout(()=>autoSay(c.say||clean(c.fr)),150);
  }
  show();
}

/* ---------- Verb tables ---------- */
function runTables(){
  const main=$('#main');main.replaceChildren();window.scrollTo(0,0);
  main.append(h('div',{class:'qtop'},h('button',{class:'link',onclick:()=>render(state.tab)},'‹ Tillbaka')),h('h2',null,'Fyll i tabellerna'),h('p',{class:'lead'},'Skriv alla former och tryck på Rätta. I passé composé skriver du hjälpverbet och participet, till exempel ”ai fini”.'));
  const all=[];
  const wrap=h('div',{class:'vtabs'});
  for(const v of VERBS){
    const box=h('div',{class:'vt'},h('h3',null,v.title));
    v.f.forEach((form,k)=>{
      const inp=h('input',{type:'text',autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false',lang:'fr','aria-label':`${v.inf}, ${TPR[k]}`});
      const key=h('div',{class:'key'});
      box.append(h('div',{class:'row'},h('span',null,(k===0&&v.inf!=='venir')?'j’ (je)':TPR[k]),inp),key);
      const pron=k===0&&v.inf!=='venir'?'j’':TPR[k].split(',')[0]+' ';
      all.push({inp,key,it:{answers:[form,pron+form]},form});
    });
    wrap.append(box);
  }
  main.append(wrap);
  main.append(h('div',{class:'actions'},
    h('button',{class:'btn',onclick:()=>all.forEach(a=>{a.inp.value='';a.inp.className='';a.key.textContent=''})},'Töm'),
    h('button',{class:'btn',onclick:()=>all.forEach(a=>{a.key.textContent=a.form})},'Visa svaren'),
    h('button',{class:'btn primary',onclick:()=>{let ok=0;all.forEach(a=>{const r=grade(a.inp.value,a.it);const good=r==='ok'||r==='accent';if(good)ok++;a.inp.className=r==='ok'?'ok':r==='accent'?'warn':'bad';a.key.textContent=good&&r==='ok'?'':a.form});toast(`${ok} av ${all.length} rätt`)}},'Rätta')));
  main.append(h('div',{class:'rule'},h('p',null,'-ir-verb får particip på -i: finir → fini'),h('p',null,'-re-verb får particip på -u: vendre → vendu'),h('p',null,'Hjälpverbet är avoir: j’ai, tu as, il a, nous avons, vous avez, ils ont')));
}
function toast(t){const el=h('div',{role:'status',style:'position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20'},t);document.body.append(el);setTimeout(()=>el.remove(),2200)}

function renderStart(){
  const done=lsGet('checks',{});
  const items=[['Hushållssysslorna (övning 3)','sysslor'],['Uttrycken i övning 2','uttryck'],['Il faut och il ne faut pas (övning 11–12)','ilfaut'],['Venir i presens','verb'],['Finir och vendre i passé composé','verb'],['Glosorna från texten','glosor'],['Rummen med un/une','hemmet']];
  const last=lsGet('lastTest',null), missed=Object.keys(getMissed()).length;
  return[
    h('h2',null,'Det här ska du kunna'),
    h('p',{class:'lead'},'Bocka av när du känner dig säker.'),
    h('ul',{class:'check'},items.map(([t,tab],k)=>{const id='c'+k;const li=h('li',{class:done[id]?'done':null});
      const cb=h('input',{type:'checkbox',id,checked:!!done[id],onchange:()=>{const d=lsGet('checks',{});d[id]=cb.checked;lsSet('checks',d);li.classList.toggle('done',cb.checked)}});
      li.append(cb,h('label',{for:id},t),h('button',{class:'go',onclick:()=>render(tab)},'Öva'));return li})),
    h('button',{class:'big-cta',onclick:()=>runQuiz(mixTest,{record:true})},'Gör ett provtest'),
    missed?h('button',{class:'ghost-cta',onclick:()=>runMissed()},`Öva på det du missat (${missed})`):null,
    last?h('p',{class:'note'},`Senaste provtest: ${last.score} av ${last.total} rätt.`):null,
    h('div',{class:'rule'},h('p',null,'Läraren tipsar: lyssna, läs högt och träna glosor och fraser.'),h('p',null,'Tryck på 🔊 och säg efter högt – det tränar både uttal och hörförståelse.'))
  ];
}
function runMissed(){const m=Object.values(getMissed());if(!m.length){toast('Inget missat just nu');return}runQuiz(()=>shuffle(m).slice(0,25))}
function renderProv(){
  const missed=Object.keys(getMissed()).length,last=lsGet('lastTest',null);
  return[
    h('h2',null,'Provträning'),
    h('p',{class:'lead'},'25 blandade frågor från hela kapitlet – glosor, uttryck, sysslor, il faut, verb och hörövningar.'),
    h('button',{class:'big-cta',onclick:()=>runQuiz(mixTest,{record:true})},'Starta provtest'),
    last?h('p',{class:'note'},`Senaste resultat: ${last.score} av ${last.total} rätt.`):null,
    h('div',{class:'menu'},
      mi('🔁','Öva på det du missat',missed?`${missed} frågor som du svarat fel på. De försvinner när du svarar rätt.`:'Här samlas frågor du svarar fel på.',runMissed),
      mi('🧹','Nollställ','Rensa missade frågor, bockar och resultat på den här enheten.',()=>{if(confirm('Rensa allt sparat på den här enheten?')){lsSet('missed',{});lsSet('checks',{});lsSet('lastTest',null);render('prov')}}))
  ];
}

const state={tab:lsGet('tab','start')};
function render(tab){
  if(!TABS.find(t=>t.id===tab))tab='start';
  state.tab=tab;lsSet('tab',tab);
  try{speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const t=TABS.find(x=>x.id===tab);
  $('#main').replaceChildren(...t.render().filter(Boolean));
  window.scrollTo(0,0);
}
$('#tabs').append(...TABS.map(t=>h('button',{role:'tab','data-tab':t.id,type:'button',onclick:()=>{render(t.id);document.querySelector(`#tabs [data-tab="${t.id}"]`).scrollIntoView({inline:'center',block:'nearest'})}},t.label)));

/* ---------- Header ---------- */
(function(){
  const today=new Date();today.setHours(0,0,0,0);
  const d=Math.round((TEST_DATE-today)/86400000);
  const el=$('#countdown');
  if(d>1)el.append('Provet är onsdag 21 oktober – ',h('b',null,`om ${d} dagar`),'.');
  else if(d===1)el.append(h('b',null,'Provet är i morgon!'),' Kör ett sista provtest.');
  else if(d===0)el.append(h('b',null,'Provet är idag – lycka till!'));
  else el.append('Provet var onsdag 21 oktober.');
  const sb=$('#soundBtn'),lb=$('#slowBtn');
  const upd=()=>{sb.setAttribute('aria-pressed',String(soundOn));sb.textContent=soundOn?'🔊 Läs upp franskan':'🔇 Uppläsning av';lb.setAttribute('aria-pressed',String(slow))};
  sb.onclick=()=>{soundOn=!soundOn;lsSet('sound',soundOn);if(!soundOn)try{speechSynthesis.cancel()}catch(e){};upd()};
  lb.onclick=()=>{slow=!slow;lsSet('slow',slow);upd();say('Il faut faire le ménage !')};
  upd();
})();
render(state.tab);
